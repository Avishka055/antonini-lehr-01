<!doctype html><html lang='si'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AMCEPT Lehr - Hourly Temperature Log</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#1e293b}.app{max-width:600px;margin:auto;min-height:100vh;background:#f8fafc}.header{background:linear-gradient(135deg,#062f55,#0969a5);color:#fff;padding:20px;text-align:center}.header h1{margin:0;font-size:25px}.card{background:#fff;margin:14px;padding:16px;border-radius:14px;box-shadow:0 3px 12px #0001}.title{font-weight:bold;color:#064b7b;margin-bottom:12px}label{font-size:13px;font-weight:bold}select,input{width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.photo{border:2px dashed #0b72b9;border-radius:12px;padding:20px;text-align:center;background:#f0f9ff}.btn{display:block;width:100%;border:0;padding:14px;border-radius:10px;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.camera{background:#0878c0}.ocr{background:#7c3aed;margin-top:12px}.save{background:#16a34a;font-size:18px}#imageInput{display:none}#preview{display:none;width:100%;margin-top:15px;border-radius:10px}.speed{border:2px solid #f97316;background:#fff7ed}.speed input{text-align:center;font-size:22px;font-weight:bold;color:#d35400}.temps{width:100%;border-collapse:collapse}.temps th{background:#075985;color:#fff;padding:10px}.temps td{padding:7px 4px;text-align:center;border-bottom:1px solid #e2e8f0}.temps input{margin:0;text-align:center;padding:9px 4px}.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.hour{padding:9px 3px;text-align:center;border-radius:7px;font-size:12px;background:#ffedd5;color:#9a3412;font-weight:bold}.hour.ok{background:#dcfce7;color:#166534}</style></head><body><div class='app'><div class='header'><h1>🔥 AMCEPT LEHR</h1><div>Hourly Temperature Log</div></div><div class='card'><div class='title'>📝 Record Information</div><div class='row'><div><label>📅 Date</label><input type='date' id='date'></div><div><label>🕐 Hour</label><select id='hour'></select></div></div><label>👤 Operator</label><select id='operator'><option value=''>Select Operator</option><option>Sachith</option><option>Prabath</option><option>Waruna</option><option>Operator 4</option><option>Operator 5</option></select></div><div class='card'><div class='title'>📷 AMCEPT HMI Photo</div><div class='photo'><label class='btn camera' for='imageInput'>📷 TAKE / UPLOAD PHOTO</label><input id='imageInput' type='file' accept='image/*' capture='environment'><img id='preview'></div><button class='btn ocr' onclick='runOCR()'>🔍 READ HMI VALUES</button></div><div class='card speed'><div class='title'>⚙️ Mat Speed</div><input type='number' step='.1' id='speed' placeholder='0.0'><div style='text-align:center;margin-top:6px;font-weight:bold'>MM/Min</div></div><div class='card'><div class='title'>🌡️ Temperature Readings</div><table class='temps'><thead><tr><th>TC</th><th>PV °C</th><th>SV °C</th></tr></thead><tbody id='tb'></tbody></table></div><div class='card'><button class='btn save' onclick='saveRecord()'>✅ VERIFY & SAVE</button></div><div class='card'><div class='title'>🕐 Today's Hourly Records</div><div class='hours' id='hours'></div></div></div><script>for(let i=3;i<=13;i++)tb.insertAdjacentHTML('beforeend',`<tr><td><b>TC-${i}</b></td><td><input type='number' step='.1' id='tc${i}pv'></td><td><input type='number' step='.1' id='tc${i}sv'></td></tr>`);for(let h=0;h<24;h++){let t=String(h).padStart(2,'0')+':00';hour.add(new Option(t,t))}let n=new Date();date.value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');hour.value=String(n.getHours()).padStart(2,'0')+':00';imageInput.onchange=function(){if(this.files[0]){preview.src=URL.createObjectURL(this.files[0]);preview.style.display='block'}};function runOCR(){alert(imageInput.files.length?'Photo එක සූදානම් ✅\nOCR module එක ඊළඟ version එකේ connect කරමු.':'කරුණාකර HMI photo එකක් ගන්න.')}function saveRecord(){if(!operator.value)return alert('Operator තෝරන්න.');if(!speed.value)return alert('Mat Speed ඇතුළත් කරන්න.');let k='AMCEPT_'+date.value+'_'+hour.value;if(localStorage.getItem(k)&&!confirm('මෙම පැයට record එකක් තිබේ. Update කරන්නද?'))return;let temps={};for(let i=3;i<=13;i++)temps['TC-'+i]={PV:document.getElementById('tc'+i+'pv').value,SV:document.getElementById('tc'+i+'sv').value};localStorage.setItem(k,JSON.stringify({date:date.value,hour:hour.value,operator:operator.value,matSpeed:speed.value,temperature:temps,savedAt:new Date().toISOString()}));alert('✅ Record Saved');status()}function status(){hours.innerHTML='';for(let h=0;h<24;h++){let t=String(h).padStart(2,'0')+':00',k='AMCEPT_'+date.value+'_'+t,e=localStorage.getItem(k),d=document.createElement('div');d.className='hour'+(e?' ok':'');d.innerHTML=t+'<br>'+(e?'✅ Recorded':'⏳ Pending');d.onclick=()=>{hour.value=t;if(e){let r=JSON.parse(e);operator.value=r.operator;speed.value=r.matSpeed;for(let i=3;i<=13;i++){let x=r.temperature['TC-'+i];document.getElementById('tc'+i+'pv').value=x.PV;document.getElementById('tc'+i+'sv').value=x.SV}}};hours.appendChild(d)}}date.onchange=status;status();</script></body></html>
